apiVersion: v1
kind: Service
metadata:
  name: pod-observer
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pod-observer.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pod-observer
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  type: {{ .Values.service.type }}
