{{- if not .Values.anthropic.existingSecret }}
{{- if not .Values.anthropic.apiKey }}
{{- fail "Set anthropic.apiKey (or anthropic.existingSecret to point at one you manage yourself)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pod-observer-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pod-observer.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropic-api-key: {{ .Values.anthropic.apiKey | quote }}
{{- end }}
