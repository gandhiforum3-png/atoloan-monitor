{{- if not .Values.anthropic.existingSecret }}
{{- if and (not .Values.anthropic.apiKey) (not .Values.anthropic.allowMissingKey) }}
{{- fail "Set anthropic.apiKey (or anthropic.existingSecret to point at one you manage yourself), or set anthropic.allowMissingKey=true to enter a key later through the dashboard instead." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: pod-observer-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pod-observer.labels" . | nindent 4 }}
type: Opaque
stringData:
  anthropic-api-key: {{ .Values.anthropic.apiKey | default "" | quote }}
{{- end }}
